<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>To Do App</title>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }

        input {
            padding: 6px;
        }

        button {
            padding: 6px;
            cursor: pointer;
        }

        li {
            cursor: pointer;
            margin: 6px 0;
            color: blue;
        }
    </style>
</head>
<body>

    <h2>My To-Do List</h2>

    <input type="text" id="taskInput" placeholder="Enter task">
    <button id="addBtn" style="background-color:#4c70af;color:white;padding:10px 18px;border:none;border-radius:6px;cursor:pointer;font-size:16px;">
  Add Task
</button>


    <ol id="taskList"></ol>


    <script src="./To-do.js"></script>
</body>
</html>
